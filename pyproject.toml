# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-orc-docker"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "mysql-connector-python",
    "requests",
    "pyvardump",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
# each example is a project of its own: its directory is its import root
pythonpath = [
    "examples/python_with_pytest",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "scripts",
    ".",
    # the pytest example imports its sibling "module" package
    "examples/python_with_pytest",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"
