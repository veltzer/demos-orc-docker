# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-orc-docker"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "mysql-connector-python",
    "requests",
    "pyvardump",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "mysql.*",
    "pyvardump.*",
]
ignore_missing_imports = true
