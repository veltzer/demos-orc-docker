# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises", "notes"]

[processor.zspell]
src_dirs = ["exercises", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# mypy 2.3 keeps its incremental cache in SQLite. batch = false means one mypy
# process per file, and rsconstruct runs those in parallel -- they all open the
# same .mypy_cache database and race, so a writer hits
# "sqlite3.OperationalError: database is locked" and mypy dies with an
# INTERNAL ERROR. It reproduced 8/8 on a cold cache and explains why CI only
# failed on the runs that started from a cold/partial cache.
# max_jobs = 1 serializes the mypy invocations. Same files, same checks, and
# it is actually faster than the racing parallel version (12s vs 16s here),
# because the contention cost more than the concurrency won.
max_jobs = 1

[processor.requirements]
src_dirs = ["scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.eslint]
src_dirs = ["config"]
args = ["-c", "config/eslint.config.js"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern.
[dependencies]
pip = [
    "flask",
    "mysql-connector-python",
    "requests",
    "pyvardump",
    "types-requests",
]
