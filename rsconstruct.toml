# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises", "notes", "compose", "examples"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["exercises", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# mypy 2.3 keeps its incremental cache in SQLite. batch = false means one mypy
# process per file, and rsconstruct runs those in parallel -- they all open the
# same .mypy_cache database and race, so a writer hits
# "sqlite3.OperationalError: database is locked" and mypy dies with an
# INTERNAL ERROR. It reproduced 8/8 on a cold cache and explains why CI only
# failed on the runs that started from a cold/partial cache.
# max_jobs = 1 serializes the mypy invocations. Same files, same checks, and
# it is actually faster than the racing parallel version (12s vs 16s here),
# because the contention cost more than the concurrency won.
max_jobs = 1

# ─── shell ───────────────────────────────────────────────────────────────────

# --external-sources lets shellcheck follow the tracked .env files that the
# compose exercises source, so their variables are seen as assigned.
[processor.shellcheck]
src_dirs = ["scripts", "exercises", "config", "compose", "examples", "fun"]
src_files = [".auto.enter.sh", ".auto.exit.sh"]
args = ["--external-sources"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.yamllint]
src_dirs = ["compose", "exercises"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_dirs = ["compose", "examples", "exercises"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_dirs = ["compose/exercises/nodejs_postgresql/app", "exercises/nodejs"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["exercises/java_build_maven_in_docker"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["examples", "exercises"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["exercises"]
args = ["-c", "checkstyle.xml"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.htmlhint]
src_dirs = ["compose/exercises/cors"]

# ─── css ─────────────────────────────────────────────────────────────────────

[processor.stylelint]
src_dirs = ["examples/hello_dotnet_build_and_run/test/Styles"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_dirs = ["compose/exercises", "examples/hello_dotnet_build_and_run/test/Scripts", "exercises/nodejs"]
args = ["-c", ".eslint.config.js"]
